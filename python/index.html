<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload Reports — S ASIA SALES REPORT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root {
  --red: #E0202E;
  --red-dark: #8E1620;
  --red-darker: #3B0B0F;
  --ink: #1B1B1F;
  --gray-700: #4A4A52;
  --gray-500: #8A8A93;
  --gray-300: #D8D8DE;
  --gray-100: #F2F2F4;
  --bg: #F5F5F7;
  --white: #FFFFFF;
  --gold: #F5A623;
  --green: #10B981;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --topbar-h: 64px;
  --shadow-card: 0 2px 8px rgba(20,20,30,.06);
}

/* ============================================================
   2. RESET
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
svg    { display: block; }

/* ============================================================
   3. TOPBAR
   ============================================================ */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: linear-gradient(90deg, var(--red-darker), var(--red-dark));
  display: flex;
  align-items: center;
  padding: 0 32px;
  z-index: 10;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
}

.brand { display: flex; align-items: center; gap: 12px; color: #fff; }

.brand-mark {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--red);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,.25);
}

.brand-name { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
.brand-sub  { font-size: 11px; opacity: .7; font-weight: 500; }

/* ============================================================
   4. LAYOUT
   ============================================================ */
.main {
  max-width: 900px;
  margin: 0 auto;
  padding: calc(var(--topbar-h) + 32px) 24px 48px;
}

@media (max-width: 600px) {
  .main { padding: calc(var(--topbar-h) + 20px) 16px 40px; }
  .topbar { padding: 0 16px; }
}

.page-header { margin-bottom: 28px; }
.page-header h1 { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.page-header p  { font-size: 14px; color: var(--gray-500); }

/* ============================================================
   5. CARD
   ============================================================ */
.card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--gray-100);
  margin-bottom: 24px;
}

.card-title { font-size: 16px; font-weight: 800; margin-bottom: 20px; }

/* ============================================================
   6. FORM FIELDS
   ============================================================ */
.field { margin-bottom: 20px; }

.field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--gray-700);
}

.field-hint {
  display: block;
  font-size: 12px;
  color: var(--gray-500);
  margin-bottom: 8px;
}

.field input[type="file"],
.field input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--white);
  transition: border-color .15s, box-shadow .15s;
}

.field input[type="file"] {
  padding: 10px 12px;
  background: var(--gray-100);
  cursor: pointer;
}

.field input[type="text"]:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(224,32,46,.12);
}

.field input[type="file"]:hover {
  border-color: var(--red);
  background: #fff0f1;
}

.delimiter-wrap {
  max-width: 120px;
}

/* ============================================================
   7. BUTTONS
   ============================================================ */
.button-group {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .15s;
}

.btn svg { width: 16px; height: 16px; }

.btn-primary {
  background: var(--red);
  color: #fff;
  box-shadow: 0 4px 12px rgba(224,32,46,.3);
}
.btn-primary:hover { background: var(--red-dark); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

/* ============================================================
   8. RESULT BOX
   ============================================================ */
.result-box {
  margin-top: 20px;
  background: var(--gray-100);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--gray-700);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 360px;
  overflow: auto;
  border: 1px solid var(--gray-300);
}

.result-box.ok  { background: #d1fae5; border-color: #6ee7b7; color: #047857; }
.result-box.err { background: #fee2e2; border-color: #fecaca; color: #991b1b; }

/* ============================================================
   9. SPINNER
   ============================================================ */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div>
      <div class="brand-name">S ASIA SALES REPORT</div>
      <div class="brand-sub">Reports Upload</div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page-header">
    <h1>Upload Order Reports</h1>
    <p>Muat naik Order History & Tax Invoice untuk diproses</p>
  </div>

  <div class="card">
    <div class="card-title">📁 Select Files</div>

    <form id="uploadForm">
      <div class="field">
        <label for="order_history">Order History File</label>
        <span class="field-hint">Supported: .xlsx, .csv</span>
        <input type="file" id="order_history" name="order_history" accept=".xlsx,.csv">
      </div>

      <div class="field">
        <label for="tax_invoice">Tax Invoice File</label>
        <span class="field-hint">Supported: .xlsx, .csv</span>
        <input type="file" id="tax_invoice" name="tax_invoice" accept=".xlsx,.csv">
      </div>

      <div class="field delimiter-wrap">
        <label for="delimiter">CSV Delimiter</label>
        <span class="field-hint">Default: <code>,</code></span>
        <input type="text" id="delimiter" name="delimiter" value="," maxlength="1">
      </div>

      <div class="button-group">
        <button type="submit" id="submitBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload Files
        </button>
      </div>
    </form>

    <pre id="result" class="result-box" style="display:none;"></pre>
  </div>
</main>

<script>
const apiUrl = (() => {
  const currentOrigin = window.location.origin;
  const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

  if (isLocalDev && currentOrigin.includes('localhost')) {
    return `${currentOrigin}/process`;
  }

  return `${currentOrigin}/python/process`;
})();

const form       = document.getElementById('uploadForm');
const resultEl   = document.getElementById('result');
const submitBtn  = document.getElementById('submitBtn');

function setResult(text, type) {
  resultEl.style.display = 'block';
  resultEl.className = 'result-box' + (type ? ' ' + type : '');
  resultEl.textContent = text;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  submitBtn.disabled = true;
  const originalHTML = submitBtn.innerHTML;
  submitBtn.innerHTML = '<span class="spinner"></span> Uploading...';

  setResult('Uploading...', '');

  const formData = new FormData(e.target);

  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      body: formData,
      credentials: 'same-origin'
    });

    const text = await res.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(`Server returned non-JSON response (${res.status}): ${text.slice(0, 200)}`);
    }

    if (!res.ok) {
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    setResult(JSON.stringify(data, null, 2), 'ok');
  } catch (err) {
    setResult('Error: ' + err.message, 'err');
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalHTML;
  }
});
</script>
</body>
</html>
